<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Authora Admin</title>
    <link rel="stylesheet" href="admin.css" />
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="#/">Authora <span>Admin</span></a>
        <div class="account" id="account" hidden>
            <span id="account-name"></span>
            <button type="button" id="sign-out">Sign out</button>
        </div>
    </header>
    <div class="layout">
        <nav class="sidebar" id="navigation" aria-label="Main" hidden></nav>
        <main id="main" tabindex="-1">
            <p class="muted">Loading…</p>
        </main>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <noscript><p class="error">The admin interface needs JavaScript.</p></noscript>
</body>
</html>
