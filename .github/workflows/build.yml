name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Authora.slnx

      - name: Build
        run: dotnet build Authora.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Authora.slnx --configuration Release --no-build

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Check for missing migrations
        env:
          ConnectionStrings__Database: Host=localhost;Database=ci;Username=ci;Password=ci
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Authora.Infrastructure
          --startup-project src/Authora.Api
          --configuration Release
