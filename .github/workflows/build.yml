name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Authora.slnx

      - name: Build
        run: dotnet build Authora.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Authora.slnx --configuration Release --no-build

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Check for missing migrations
        env:
          ConnectionStrings__Database: Host=localhost;Database=ci;Username=ci;Password=ci
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Authora.Infrastructure
          --startup-project src/Authora.Api
          --configuration Release

  container-images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image
        run: docker build --target runtime --tag authora:ci .

      - name: Build the migrator image
        run: docker build --target migrator --tag authora-migrator:ci .
