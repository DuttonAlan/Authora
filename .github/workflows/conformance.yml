name: Conformance

# Runs the OpenID Foundation conformance suite's Basic OP certification test plan against the container built from
# this commit (tests/conformance/run.sh). Fails if a test fails, warns or is skipped that is not listed in
# tests/conformance/expected-*.json, or if a listed one no longer does. See docs/how-to/run-the-conformance-tests.md.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-op:
    name: Basic OP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the Basic OP test plan
        run: bash tests/conformance/run.sh

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            tests/conformance/.work/results/
            tests/conformance/.work/logs/
          if-no-files-found: ignore
          retention-days: 14
