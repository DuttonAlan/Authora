name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Is it a security vulnerability?** Then stop here and report it privately: see [SECURITY.md](https://github.com/DuttonAlan/Authora/blob/main/SECURITY.md).

        Never paste passwords, Client Secrets, tokens, codes or private keys into an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, requests or configuration that shows the problem.
      placeholder: |
        1. Register a Public Client with …
        2. Open /oauth/authorize?…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Authora version
      description: Release, image tag or commit.
      placeholder: e.g. 0.1.0, ghcr.io/duttonalan/authora:0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Authora?
      options:
        - Docker Compose from this repository
        - Container image
        - From source (dotnet run)
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PostgreSQL version, reverse proxy, OS, browser, client library, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with their Event Ids. Remove anything sensitive.
      render: text
