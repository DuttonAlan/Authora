# Runs Authora with PostgreSQL on https://localhost:8443 for local evaluation.
# Step by step: docs/tutorials/getting-started.md. For production: docs/how-to/deploy-to-production.md.
#
# Before the first start:
#   cp .env.example .env              # then set the passwords in .env
#   mkdir -p secrets                  # create the keys below, see the tutorial
#   docker compose up --build

name: authora

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authora
      POSTGRES_USER: authora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authora -d authora"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the database migrations, then exits. Authora never migrates at startup.
  migrate:
    build:
      context: .
      target: migrator
    image: authora-migrator:local
    environment:
      ConnectionStrings__Database: Host=db;Database=authora;Username=authora;Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  authora:
    build:
      context: .
      target: runtime
    image: authora:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    environment:
      # Kestrel terminates TLS with the self-signed certificate from ./secrets.
      ASPNETCORE_URLS: https://+:8443
      Kestrel__Certificates__Default__Path: /run/authora/tls.crt
      Kestrel__Certificates__Default__KeyPath: /run/authora/tls.key
      AllowedHosts: localhost
      ConnectionStrings__Database: Host=db;Database=authora;Username=authora;Password=${POSTGRES_PASSWORD}
      Authora__OAuth__Issuer: https://localhost:8443
      Authora__Oidc__SigningKeyPath: /run/authora/signing-key.pem
      Authora__Bootstrap__Administrator__Email: ${AUTHORA_ADMIN_EMAIL:-admin@example.com}
      # Only needed until the first administrator exists. Remove it from .env afterwards.
      Authora__Bootstrap__Administrator__Password: ${AUTHORA_ADMIN_PASSWORD:-}
    volumes:
      - ./secrets:/run/authora:ro
      - dataprotection-keys:/var/lib/authora/keys

volumes:
  db-data:
  dataprotection-keys:
