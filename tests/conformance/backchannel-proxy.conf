# nginx configuration of "backchannel-proxy" in docker-compose.yml: terminates TLS for the Logout Tokens Authora
# sends (certificate from run.sh, trusted by Authora through SSL_CERT_FILE) and forwards them to the suite's nginx
# as if they were sent to https://localhost.emobix.co.uk:8443.

events {}

http {
    server {
        listen 8443 ssl;
        server_name backchannel-proxy;

        ssl_certificate     /run/backchannel-proxy/backchannel-proxy.crt;
        ssl_certificate_key /run/backchannel-proxy/backchannel-proxy.key;
        ssl_protocols       TLSv1.3;

        location / {
            proxy_pass https://nginx:8443;
            proxy_http_version 1.1;
            proxy_set_header Host localhost.emobix.co.uk:8443;
            proxy_ssl_server_name on;
            proxy_ssl_name localhost.emobix.co.uk;
            proxy_ssl_protocols TLSv1.3;
        }
    }
}
